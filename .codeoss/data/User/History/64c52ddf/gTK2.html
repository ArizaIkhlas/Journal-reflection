<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Gemini Journal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 120px; margin-top: 10px; }
    .card { background: #f4f4f6; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>🔐 Secure Gemini AI Journal</h2>

  <!-- Authentication Controls -->
  <div id="auth-section">
    <button id="btn-login">Sign in with Google</button>
  </div>

  <!-- Journal Application UI -->
  <div id="app-section" class="hidden">
    <p>Welcome, <strong id="user-email"></strong> (<button id="btn-logout">Logout</button>)</p>
    
    <h3>New Journal Entry</h3>
    <textarea id="journal-input" placeholder="How was your day? What's on your mind?"></textarea><br>
    <button id="btn-save">Analyze & Save Entry</button>

    <div id="insight-box" class="card hidden">
      <h4>AI Reflection:</h4>
      <p id="insight-text"></p>
    </div>

    <h3>Past Journal Entries</h3>
    <div id="entries-container"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
