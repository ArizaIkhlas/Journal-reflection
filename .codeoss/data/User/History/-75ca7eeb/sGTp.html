<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Personal Gemini Journal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
    textarea { width: 100%; height: 100px; margin-top: 10px; }
    button { padding: 10px 15px; margin-top: 10px; cursor: pointer; }
    .card { border: 1px solid #ccc; padding: 15px; margin-top: 10px; border-radius: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Secure Personal Journal</h1>

  <div id="auth-section">
    <button id="login-btn">Login with Google</button>
  </div>

  <div id="app-section" class="hidden">
    <p>Welcome, <strong id="user-name"></strong>! <button id="logout-btn">Logout</button></p>
    <textarea id="journal-input" placeholder="Write your journal entry here..."></textarea>
    <button id="save-btn">Save & Analyze with AI</button>
    <h3>Journal History</h3>
    <div id="journal-list"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Replace with your Firebase configuration values
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const saveBtn = document.getElementById('save-btn');
    const journalInput = document.getElementById('journal-input');
    const journalList = document.getElementById('journal-list');

    loginBtn.addEventListener('click', () => signInWithPopup(auth, new GoogleAuthProvider()));
    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('user-name').textContent = user.displayName;
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        loadEntries();
      } else {
        authSection.classList.remove('hidden');
        appSection.classList.add('hidden');
      }
    });

    saveBtn.addEventListener('click', async () => {
      const text = journalInput.value.trim();
      if (!text) return alert("Please enter a journal entry.");

      saveBtn.disabled = true;
      saveBtn.textContent = "Processing AI...";

      try {
        const res = await fetch('/api/journal-ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ journalText: text })
        });
        const data = await res.json();

        await addDoc(collection(db, "journals"), {
          uid: currentUser.uid,
          entry: text,
          aiReflection: data.aiReflection,
          createdAt: new Date()
        });

        journalInput.value = '';
        loadEntries();
      } catch (err) {
        console.error(err);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save & Analyze with AI";
      }
    });

    async function loadEntries() {
      journalList.innerHTML = "Loading...";
      const q = query(
        collection(db, "journals"),
        where("uid", "==", currentUser.uid),
        orderBy("createdAt", "desc")
      );
      const snapshot = await getDocs(q);
      journalList.innerHTML = "";
      snapshot.forEach((doc) => {
        const item = doc.data();
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<p><strong>Entry:</strong> ${item.entry}</p><p><strong>AI Reflection:</strong> ${item.aiReflection}</p>`;
        journalList.appendChild(div);
      });
    }
  </script>
</body>
</html>
